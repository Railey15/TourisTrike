# Supabase project configuration.
# See https://supabase.com/docs/guides/local-development/cli/config

[functions.paymongo-webhook]
verify_jwt = false

[functions.paymongo-payment-webhook]
verify_jwt = false

[functions.paymongo-payment-return]
verify_jwt = false

[functions.paymongo-switch-to-cash]
verify_jwt = true

[functions.payment-email-verification]
verify_jwt = true

# Didit authenticates callbacks with its destination signing secret, not a Supabase JWT.
[functions.didit-webhook]
verify_jwt = false

# Driver JWT is checked by the gateway and again inside the handler.
[functions.didit-create-verification]
verify_jwt = true

# POST requests authenticate users inside the function. GET is reserved for
# HMAC-signed photo/static-map URLs that browsers can load without auth headers.
[functions.google-places]
verify_jwt = false

# Authenticated by a dedicated server-only secret; never callable with a user JWT alone.
[functions.send-notifications]
verify_jwt = false

# Authenticated System Administrators only; the function performs an additional
# database role check before using the server-only Auth admin API.
[functions.administrator-account-access]
verify_jwt = true

# Authenticated active municipality offices only; the function derives the
# municipality from subtenant_details and keeps PEXELS_API_KEY server-side.
[functions.municipality-cover-suggestions]
verify_jwt = true

# Fare quotes use the authenticated tourist JWT and server-side Maps key.
[functions.tour-fare-quote]
verify_jwt = true

