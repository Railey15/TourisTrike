<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="touristrike">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>touristrike</title>
  <link rel="manifest" href="manifest.json">
  <!-- SHA-256 prefix of the injected browser key, safe to compare with build logs. -->
  <meta name="touristrike-maps-key-fingerprint" content="__GOOGLE_MAPS_BROWSER_KEY_FINGERPRINT__">
</head>
<body>
  <!-- Replaced at deploy time with a separate, HTTP-referrer-restricted
       Maps JavaScript API key. Never put the server Places key here. -->
  <script>
    const mapsBrowserKey = '__GOOGLE_MAPS_BROWSER_API_KEY__';

    if (mapsBrowserKey && !mapsBrowserKey.startsWith('__')) {
      document.write(
        '<script src="https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(mapsBrowserKey) + '"><\/script>'
      );
    } else {
      console.error(
        'Google Maps JavaScript API is not configured. ' +
        'Set GOOGLE_MAPS_BROWSER_API_KEY and run the web build configurator.'
      );
    }
  </script>
  <script>
    // Called from Dart (dart:js_interop_unsafe). Accepts a single JSON params string,
    // returns a Promise<string> with a JSON result.
    window._flutterGetRoute = async function(paramsJson) {
      if (!window.google || !window.google.maps) {
        return JSON.stringify({ status: 'NO_MAPS' });
      }
      try {
        var p = JSON.parse(paramsJson);
        var routesLibrary = await google.maps.importLibrary('routes');
        var Route = routesLibrary.Route;
        var formatDuration = function(milliseconds) {
          var minutes = Math.ceil(milliseconds / 60000);
          if (minutes < 60) return minutes + ' min';
          var hours = Math.floor(minutes / 60);
          var remaining = minutes % 60;
          return remaining === 0
              ? hours + ' hr'
              : hours + ' hr ' + remaining + ' min';
        };
        var req = {
          origin: { lat: p.originLat, lng: p.originLng },
          destination: { lat: p.destLat, lng: p.destLng },
          travelMode: 'DRIVING',
          routingPreference: p.requestTraffic === true
              ? 'TRAFFIC_AWARE'
              : 'TRAFFIC_UNAWARE',
          polylineQuality: 'OVERVIEW',
          optimizeWaypointOrder: false,
          language: 'en-US',
          region: 'ph',
          units: 'METRIC',
          fields: [
            'path',
            'durationMillis',
            'distanceMeters',
            'legs.durationMillis',
            'legs.distanceMeters'
          ]
        };
        if (p.waypoints && p.waypoints.length > 0) {
          req.intermediates = p.waypoints.map(function(wp) {
            return {
              location: { lat: wp.lat, lng: wp.lng },
              via: p.stopovers !== true
            };
          });
        }
        var result = await Route.computeRoutes(req);
        var route = result.routes && result.routes[0];
        if (!route) {
          return JSON.stringify({ status: 'ZERO_RESULTS', routes: [] });
        }
        var pts = (route.path || []).map(function(point) {
          return [point.lat, point.lng];
        });
        var eta = Number.isFinite(route.durationMillis)
            ? formatDuration(route.durationMillis)
            : null;
        return JSON.stringify({ status: 'OK', points: pts, eta: eta,
          routes: [{ legs: (route.legs || []).map(function(leg) {
            var seconds = Number.isFinite(leg.durationMillis)
                ? leg.durationMillis / 1000
                : null;
            var duration = {
              value: seconds,
              text: Number.isFinite(leg.durationMillis)
                  ? formatDuration(leg.durationMillis)
                  : null
            };
            return {
              duration: duration,
              duration_in_traffic: p.requestTraffic === true ? duration : null,
              distance: { value: leg.distanceMeters }
            };
          }) }]
        });
      } catch (e) {
        return JSON.stringify({ status: 'ERROR', error: e.toString() });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
